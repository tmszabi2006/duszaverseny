# MineScript – Apache 2.4 reverse proxy
#
# Telepítés:
#   sudo cp deploy/apache-minescript.conf /etc/apache2/sites-available/minescript.conf
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo a2ensite minescript
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# A ServerName értékét és a tanúsítvány útvonalait cseréld ki!
# A Node-szerver a 127.0.0.1:3000 címen figyel; kívülről csak az Apache érhető el.

<VirtualHost *:80>
    ServerName minescript.example.hu
    # ServerAlias www.minescript.example.hu

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60

    # Minden kérést a Node-szerver kap meg: az API-t és a kész SPA-t is ő szolgálja ki.
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ErrorLog ${APACHE_LOG_DIR}/minescript-error.log
    CustomLog ${APACHE_LOG_DIR}/minescript-access.log combined

    # Éles HTTPS használatnál kommenteld ki az alábbi átirányítást,
    # vagy hagyd a Certbotra a vhost átalakítását.
    # RewriteEngine On
    # RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

